[tool.poetry]
name = "srs-agent-api"
version = "0.1.0"
description = "SRS Agent FastAPI service"
authors = []
packages = [{ include = "src" }]

[tool.poetry.dependencies]
python = "^3.11"
fastapi = "^0.111"
uvicorn = { extras = ["standard"], version = "^0.30" }
sqlalchemy = { extras = ["asyncio"], version = "^2.0" }
asyncpg = "^0.29"
alembic = "^1.13"
pydantic-settings = "^2.3"
celery = "^5.4"
redis = "^5.0"
python-multipart = "^0.0.9"
httpx = "^0.27"
tenacity = "^8.2"
cryptography = "^42.0"
srs-core = { path = "../../packages/srs_core", develop = true }

[tool.poetry.group.dev.dependencies]
pytest = "^8.2"
pytest-asyncio = "^0.23"
ruff = "^0.5"
mypy = "^1.10"

[tool.mypy]
# celery and botocore (via boto3, pulled in transitively through srs_core)
# ship no type stubs and none are published on PyPI worth depending on —
# these overrides silence the resulting import-untyped noise without
# weakening checking anywhere we actually control the types.
[[tool.mypy.overrides]]
module = ["celery.*", "botocore.*"]
ignore_missing_imports = true

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"
