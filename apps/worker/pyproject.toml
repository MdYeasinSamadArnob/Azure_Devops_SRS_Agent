[tool.poetry]
name = "srs-agent-worker"
version = "0.1.0"
description = "SRS Agent Celery worker (import, generate, asset_retry, convert)"
authors = []
packages = [{ include = "src" }]

[tool.poetry.dependencies]
python = "^3.11"
celery = "^5.4"
redis = "^5.0"
sqlalchemy = { extras = ["asyncio"], version = "^2.0" }
asyncpg = "^0.29"
psycopg2-binary = "^2.9"
boto3 = "^1.34"
python-docx = "^1.1"
docxtpl = "^0.18"
tenacity = "^8.2"
Pillow = "^10.4"
srs-core = { path = "../../packages/srs_core", develop = true }

[tool.poetry.group.dev.dependencies]
pytest = "^8.2"
pytest-asyncio = "^0.23"
ruff = "^0.5"

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"
