name: srs_agent

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    ports:
      - "5442:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./infra/docker/postgres/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks: [srs_net]

  redis:
    image: redis:7-alpine
    command: ["redis-server", "--appendonly", "yes"]
    ports:
      - "6395:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks: [srs_net]

  minio:
    image: minio/minio:latest
    command: ["server", "/data", "--console-address", ":9001"]
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD}
    ports:
      - "9020:9000"
      - "9021:9001"
    volumes:
      - minio_data:/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks: [srs_net]

  minio-init:
    image: minio/mc:latest
    depends_on:
      minio:
        condition: service_healthy
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD}
    entrypoint: ["/bin/sh", "/init-buckets.sh"]
    volumes:
      - ./infra/docker/minio/init-buckets.sh:/init-buckets.sh:ro
    networks: [srs_net]

  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    env_file: .env
    environment:
      DATABASE_URL: ${DATABASE_URL}
      REDIS_URL: ${REDIS_URL}
      CELERY_BROKER_URL: ${CELERY_BROKER_URL}
      CELERY_RESULT_BACKEND: ${CELERY_RESULT_BACKEND}
      MINIO_ENDPOINT: minio:9000
      MINIO_PUBLIC_ENDPOINT: ${MINIO_PUBLIC_ENDPOINT}
      MINIO_ACCESS_KEY: ${MINIO_ACCESS_KEY}
      MINIO_SECRET_KEY: ${MINIO_SECRET_KEY}
      MINIO_SECURE: ${MINIO_SECURE}
      APP_SECRET_KEY: ${APP_SECRET_KEY}
      PAT_ENCRYPTION_KEY: ${PAT_ENCRYPTION_KEY}
      CORS_ORIGINS: ${CORS_ORIGINS}
      AZURE_DEVOPS_API_VERSION: ${AZURE_DEVOPS_API_VERSION}
      LOCAL_ASSET_FALLBACK_DIR: ${LOCAL_ASSET_FALLBACK_DIR}
      API_PUBLIC_BASE_URL: ${NEXT_PUBLIC_API_BASE_URL}
    volumes:
      - local_asset_fallback:/data/local-assets
    ports:
      - "8010:8000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      minio-init:
        condition: service_completed_successfully
    networks: [srs_net]

  worker-default:
    build:
      context: .
      dockerfile: apps/worker/Dockerfile
    command: ["celery", "-A", "src.celery_app", "worker", "--loglevel=INFO", "-Q", "default", "--concurrency=4"]
    env_file: .env
    environment:
      DATABASE_URL: ${DATABASE_URL}
      REDIS_URL: ${REDIS_URL}
      CELERY_BROKER_URL: ${CELERY_BROKER_URL}
      CELERY_RESULT_BACKEND: ${CELERY_RESULT_BACKEND}
      MINIO_ENDPOINT: minio:9000
      MINIO_ACCESS_KEY: ${MINIO_ACCESS_KEY}
      MINIO_SECRET_KEY: ${MINIO_SECRET_KEY}
      MINIO_SECURE: ${MINIO_SECURE}
      PAT_ENCRYPTION_KEY: ${PAT_ENCRYPTION_KEY}
      LOCAL_ASSET_FALLBACK_DIR: ${LOCAL_ASSET_FALLBACK_DIR}
      OLLAMA_BASE_URL: ${OLLAMA_BASE_URL}
      MODEL_NAME: ${MODEL_NAME}
      LLM_THINKING: ${LLM_THINKING}
    volumes:
      - local_asset_fallback:/data/local-assets
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      minio-init:
        condition: service_completed_successfully
    networks: [srs_net]

  worker-document:
    build:
      context: .
      dockerfile: apps/worker/Dockerfile
    command: ["celery", "-A", "src.celery_app", "worker", "--loglevel=INFO", "-Q", "document", "--concurrency=2"]
    env_file: .env
    environment:
      DATABASE_URL: ${DATABASE_URL}
      REDIS_URL: ${REDIS_URL}
      CELERY_BROKER_URL: ${CELERY_BROKER_URL}
      CELERY_RESULT_BACKEND: ${CELERY_RESULT_BACKEND}
      MINIO_ENDPOINT: minio:9000
      MINIO_ACCESS_KEY: ${MINIO_ACCESS_KEY}
      MINIO_SECRET_KEY: ${MINIO_SECRET_KEY}
      MINIO_SECURE: ${MINIO_SECURE}
      PAT_ENCRYPTION_KEY: ${PAT_ENCRYPTION_KEY}
      LOCAL_ASSET_FALLBACK_DIR: ${LOCAL_ASSET_FALLBACK_DIR}
      OLLAMA_BASE_URL: ${OLLAMA_BASE_URL}
      MODEL_NAME: ${MODEL_NAME}
      LLM_THINKING: ${LLM_THINKING}
    volumes:
      - local_asset_fallback:/data/local-assets
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      minio-init:
        condition: service_completed_successfully
    networks: [srs_net]

  worker-conversion:
    build:
      context: .
      dockerfile: apps/worker/Dockerfile
    # One LibreOffice conversion per process — a hung/heavy soffice process must
    # never be able to starve import or DOCX-rendering throughput.
    command: ["celery", "-A", "src.celery_app", "worker", "--loglevel=INFO", "-Q", "conversion", "--concurrency=1"]
    env_file: .env
    environment:
      DATABASE_URL: ${DATABASE_URL}
      REDIS_URL: ${REDIS_URL}
      CELERY_BROKER_URL: ${CELERY_BROKER_URL}
      CELERY_RESULT_BACKEND: ${CELERY_RESULT_BACKEND}
      MINIO_ENDPOINT: minio:9000
      MINIO_ACCESS_KEY: ${MINIO_ACCESS_KEY}
      MINIO_SECRET_KEY: ${MINIO_SECRET_KEY}
      MINIO_SECURE: ${MINIO_SECURE}
      PAT_ENCRYPTION_KEY: ${PAT_ENCRYPTION_KEY}
      LOCAL_ASSET_FALLBACK_DIR: ${LOCAL_ASSET_FALLBACK_DIR}
      OLLAMA_BASE_URL: ${OLLAMA_BASE_URL}
      MODEL_NAME: ${MODEL_NAME}
      LLM_THINKING: ${LLM_THINKING}
    volumes:
      - local_asset_fallback:/data/local-assets
    deploy:
      resources:
        limits:
          memory: 2g
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      minio-init:
        condition: service_completed_successfully
    networks: [srs_net]

  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
    environment:
      NEXT_PUBLIC_API_BASE_URL: ${NEXT_PUBLIC_API_BASE_URL}
      API_INTERNAL_URL: ${API_INTERNAL_URL}
    ports:
      - "3010:3000"
    depends_on:
      - api
    networks: [srs_net]

networks:
  srs_net:

volumes:
  pgdata:
  redis_data:
  minio_data:
  local_asset_fallback:
